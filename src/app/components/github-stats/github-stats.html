<section class="github">

<div class="container">

<div class="heading">

<p>Development Activity</p>

<h2>GitHub Statistics</h2>

</div>

<div class="stats-grid">

<div
class="card"
*ngFor="let stat of stats">

<div class="icon">

{{stat.icon}}

</div>

<h3>

{{stat.title}}

</h3>

<h1>

{{stat.value}}

</h1>

</div>

</div>

<div class="coming">

<p>

📈 Live GitHub statistics will be integrated soon.

</p>

</div>

</div>

</section>
