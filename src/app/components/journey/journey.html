<section class="journey">

    <div class="container">

        <div class="heading">

            <p>My Growth</p>

            <h2>Journey</h2>

        </div>

        <div class="timeline">

            <div
                class="item"
                *ngFor="let item of timeline">

                <div class="dot"></div>

                <div class="content">

                    <span>

                        {{item.year}}

                    </span>

                    <h3>

                        {{item.title}}

                    </h3>

                    <p>

                        {{item.description}}

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
