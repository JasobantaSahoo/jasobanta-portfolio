<section id="projects" class="projects">

    <div class="container">

        <div class="heading">

            <p>My Work</p>

            <h2>Projects</h2>

        </div>

        <div class="project-grid">

            <div
            class="project-card"
            *ngFor="let project of projects"
            data-aos="flip-left">

                <img
                [src]="project.image"
                [alt]="project.title">

                <div class="content">

                    <h3>

                        {{project.title}}

                    </h3>

                    <p>

                        {{project.description}}

                    </p>

                    <div class="tech">

                        <span
                        *ngFor="let tech of project.technologies">

                            {{tech}}

                        </span>

                    </div>

                    <a
                    [routerLink]="['/project',project.id]">

                        View Details →

                    </a>

                </div>

            </div>

        </div>

    </div>

</section>
