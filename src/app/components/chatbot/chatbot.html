<div class="chat-button" (click)="toggleChat()">

    💬

</div>

<div class="chat-window" *ngIf="isOpen">

    <div class="header">

        <h3>

            AI Assistant

        </h3>

        <button (click)="toggleChat()">

            ✕

        </button>

    </div>

    <div class="messages">

        <div
        *ngFor="let message of messages"
        [ngClass]="message.sender">

            {{message.text}}

        </div>

    </div>

    <div class="input-area">

        <input
        [(ngModel)]="userMessage"
        placeholder="Ask something...">

        <button
        (click)="sendMessage()">

            Send

        </button>

    </div>

</div>
