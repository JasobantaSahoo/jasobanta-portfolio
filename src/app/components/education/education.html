<section id="education" class="education">

    <div class="container">

        <div class="heading">

            <p>Academic Journey</p>

            <h2>Education</h2>

        </div>

        <div class="timeline">

            <div
                class="timeline-item"
                *ngFor="let item of education"
                data-aos="fade-up">

                <div class="circle"></div>

                <div class="card">

                    <span class="year">

                        {{item.year}}

                    </span>

                    <h3>

                        {{item.degree}}

                    </h3>

                    <h4>

                        {{item.institute}}

                    </h4>

                    <p>

                        {{item.score}}

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
